[custom]

;==============================================================
; 三订阅整合配置  airport3.ini
; 基于 airport.ini：28 条规则集原样保留，只重建策略组
;==============================================================
;
; 【订阅顺序 = 分组编号，必须与 &url= 的先后一致】
;   GROUPID=0 → 🏆 优质机场   (主用 · 流量纯净)
;   GROUPID=1 → 💧 良心云     (便宜 A)
;   GROUPID=2 → 🍂 其他机场   (便宜 B)
;
; 【为什么不用 !!GROUPID=!N】
;   源码 matchRange()：!N 表示「排除第 N+1 个」，不是「选中第 N+1 个」。
;   旧文件里 !1 == 除第 2 个以外的全部；只有 2 个订阅时看着正常，
;   加到 3 个订阅立刻串味：!1 → {0,2}，优质机场会和第三家混在同一组。
;   本文件一律写全 0 / 1 / 2 / 1,2 / 0,1,2 —— 以后再添订阅也不会错。
;
; 【命名：机场 × 地区 两层交叉】
;   🏆 香港  💧 香港  🍂 香港   ← 单机场单地区
;   🇭🇰 香港节点               ← 三机场按地区汇总
;   💰 便宜-香港              ← 只取两家便宜机场

;--------------------------------------------------------------
; 零、接入方式（重要，决定分组能否正确工作）
;--------------------------------------------------------------
; 三个订阅按顺序放进 url，用 | 分隔，顺序不能乱：
;   &url=优质机场订阅|良心云订阅|其他机场订阅
;   第 1 个 → GROUPID=0，第 2 个 → GROUPID=1，第 3 个 → GROUPID=2
;
; 建议给每家的节点名加前缀（在机场后台改「别名/备注」），例如：
;   A-香港01   B-香港01   C-香港01
; 否则三家都有「香港01」时，subconverter 会把重名的自动改成
; 「香港01 2」「香港01 3」——虽然仍能按 GROUPID 分到各自的机场组，
; 但在 Clash 里肉眼分不清是哪个机场的节点。
;
; 若机场不允许改名，也可用 subconverter 的 &rename= 参数统一加前缀。
;
;--------------------------------------------------------------
; 一、规则集（与原 airport.ini 完全一致，顺序未改）
;--------------------------------------------------------------
