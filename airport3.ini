[custom]

;==============================================================
; airport3.ini
; 规则集沿用原 airport.ini（28 条，顺序未改）
; 每个订阅独立成组：机场 → 地区节点 → 自动
; 规则组内放入具体地区选项，不再只给聚合入口
;==============================================================
;
; 【订阅顺序】按你自己的顺序放，依次对应：
;   第 1 个 → 🏆 优质机场   (GROUPID=0，严格纯净)
;   第 2 个 → 💧 良心云     (GROUPID=1)
;   第 3 个 → 🍂 其他机场   (GROUPID=2)
;
; 【规则组选项顺序】（以 📹 YouTube 为例，其余同理）
;   1. 🚀 节点选择
;   2. 🏆 优质机场  → 🇭🇰/🇯🇵/🇸🇬/🇺🇸/🇪🇺 优质机场-各地区 → ♻️ 优质机场-自动
;   3. 💧 良心云    → 各地区 → 自动
;   4. 🍂 其他机场  → 各地区 → 自动
;   5. 🛠️ 手动切换
;   6. DIRECT
;   不加 REJECT（仅 AdBlock 保留 REJECT）
;
; 【纯净度】🏆 优质机场 剔除 倍率/剩余/家宽/游戏/中转/落地/到期；
;   其余两家只剔除「剩余」「到期」。

;--------------------------------------------------------------
; 一、规则集（与原 airport.ini 完全一致，顺序未改）
;--------------------------------------------------------------
