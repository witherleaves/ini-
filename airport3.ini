[custom]

;==============================================================
; airport3.ini
; 规则集沿用原 airport.ini（28 条，顺序未改）
; 策略组：每个订阅独立成组，先分地区、再分自动，不做跨订阅混合
;==============================================================
;
; 【订阅顺序】按你自己的顺序放，三个订阅依次对应：
;   订阅一 → GROUPID=0
;   订阅二 → GROUPID=1
;   订阅三 → GROUPID=2
;
; 【层级】订阅一 → 各地区节点 → 自动
;   订阅一`select` 内含：
;     []订阅一 香港节点
;     []订阅一 日本节点
;     []订阅一 新加坡节点
;     []订阅一 美国节点
;     []订阅一 欧盟节点
;     []订阅一 自动
;   订阅二、订阅三 结构完全相同，各自独立，互不引用。
;
; 【不混合】不生成「三机场合并香港」这类跨订阅汇总组。
;
; 【纯净度】订阅一按优质机场处理，剔除 倍率/剩余流量/家宽/游戏/中转/落地/到期；
;   订阅二、三为便宜机场，只剔除「剩余」「到期」这类无效条目。
;   如需让二、三也严格过滤，把对应行的 (剩余|到期) 换成严格列表即可。

;--------------------------------------------------------------
; 一、规则集（与原 airport.ini 完全一致，顺序未改）
;--------------------------------------------------------------
ruleset=🛡️ AdBlock,clash-domain:https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main//Filters/AWAvenue-Ads-Rule-Clash.yaml
